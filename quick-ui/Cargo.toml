[package]
name = "quick-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
glib = "0.22.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
minreq = { version = "3.0.0", features = ["urlencoding"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
